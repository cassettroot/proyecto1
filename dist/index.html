<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./public/img/favico.png" type="image/x-icon">
    <title>Examen Unidad 4</title>
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <h1 class="text-danger">Examen Unidad 4</h1>
                <hr>

                <div class="mb-3 text-start">
                    <label for="expresion" class="form-label text-danger">Ingresa la expresión regular:</label>
                    <input id="expresion" class="form-control" type="text" placeholder="Ejemplo de como es [0-9A-Za-z]">
                </div>

                <div class="mb-3 text-start">
                    <label for="texto" class="form-label text-danger ">Ingresa el texto que desees comparar:</label>
                    <input id="texto" class="form-control" type="text" placeholder="Escribe el texto a comparar">
                </div>

                <div class="mt-3">
                    <button id="btn_comparar" type="button" class="btn btn-danger me-2"> Comparar </button>
                    <button id="btn_limpiar" type="button" class="btn btn-secondary"> Limpiar/Borrar </button>
                </div>
            </div>
        </div>
    </div>    
    <script src="./bundle.js"></script>
</body>
</html>
